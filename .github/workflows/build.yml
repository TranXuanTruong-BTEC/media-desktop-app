name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.0.1)"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate icon 256x256
        shell: python
        run: |
          import struct, zlib, os

          def make_png(size, r, g, b):
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr_data = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              ihdr_crc = zlib.crc32(b'IHDR' + ihdr_data) & 0xffffffff
              ihdr = struct.pack('>I', 13) + b'IHDR' + ihdr_data + struct.pack('>I', ihdr_crc)
              raw = b''
              for y in range(size):
                  raw += b'\x00'
                  for x in range(size):
                      cx, cy = size // 2, size // 2
                      d = ((x - cx)**2 + (y - cy)**2) ** 0.5
                      margin = size * 0.08
                      if x < margin or x >= size - margin or y < margin or y >= size - margin:
                          raw += bytes([15, 40, 100])
                      else:
                          raw += bytes([r, g, b])
              comp = zlib.compress(raw)
              idat_crc = zlib.crc32(b'IDAT' + comp) & 0xffffffff
              idat = struct.pack('>I', len(comp)) + b'IDAT' + comp + struct.pack('>I', idat_crc)
              iend_crc = zlib.crc32(b'IEND') & 0xffffffff
              iend = struct.pack('>I', 0) + b'IEND' + struct.pack('>I', iend_crc)
              return sig + ihdr + idat + iend

          def make_ico(path):
              sizes = [256, 64, 48, 32, 16]
              images = [make_png(s, 37, 99, 235) for s in sizes]
              count = len(images)
              header = struct.pack('<HHH', 0, 1, count)
              offset = 6 + count * 16
              entries = b''
              for i, (s, img) in enumerate(zip(sizes, images)):
                  w = 0 if s == 256 else s
                  h = 0 if s == 256 else s
                  entries += struct.pack('<BBBBHHII', w, h, 0, 0, 1, 32, len(img), offset)
                  offset += len(img)
              os.makedirs('build', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(header + entries + b''.join(images))
              print(f'Icon created: {path}')

          make_ico('build/icon.ico')

      - name: Download yt-dlp.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tools
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"

      # yt-dlp (from 2026) requires Node >= 22 for YouTube JS challenges.
      - name: Download node.exe (portable Node 22)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tools
          Invoke-WebRequest -Uri "https://nodejs.org/dist/latest-v22.x/win-x64/node.exe" -OutFile "tools/node.exe"

      # CI is the only publisher. electron-builder only builds (never uploads)
      # so the installer and latest.yml cannot get out of sync from two writers.
      - name: Build installer
        run: npm run dist -- --publish never

      - name: Generate latest.yml from the built installer
        run: node scripts/write-latest-yml.js

      - name: Verify update metadata matches installer
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $yml = Get-Content release/latest.yml -Raw
          if ($yml -notmatch "path:\s*(\S+)") { throw "latest.yml missing path" }
          $name = $Matches[1].Trim()
          $exe = Get-Item "release/$name"
          if ($yml -notmatch "size:\s*(\d+)") { throw "latest.yml missing size" }
          if ([int64]$Matches[1] -ne $exe.Length) { throw "latest.yml size ($($Matches[1])) != exe ($($exe.Length))" }
          if ($yml -notmatch "version:\s*(\S+)") { throw "latest.yml missing version" }
          $ymlVersion = $Matches[1].Trim().Trim("'").Trim('"')
          if ($ymlVersion -ne $pkg.version) {
            throw "latest.yml version ($ymlVersion) != package.json ($($pkg.version))"
          }
          $bytes = [System.IO.File]::ReadAllBytes("release/latest.yml")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "latest.yml has UTF-8 BOM"
          }
          Write-Host "OK: latest.yml v$ymlVersion matches $name ($($exe.Length) bytes)"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaGet-Windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
