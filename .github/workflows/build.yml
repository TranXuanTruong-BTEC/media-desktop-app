name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 2.0.1)"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify app icon
        shell: powershell
        run: |
          if (-not (Test-Path "build/icon.ico")) { throw "Missing build/icon.ico" }
          Write-Host "Using committed app icon: build/icon.ico ($((Get-Item build/icon.ico).Length) bytes)"

      # Công cụ đóng gói kèm installer (và được CHẠY trên máy người dùng) → bắt buộc xác minh
      # SHA-256 theo checksum chính thức của nhà phát hành trước khi đưa vào bản build.
      - name: Download yt-dlp.exe (verified against official SHA2-256SUMS)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $tag = (Invoke-RestMethod -Uri "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          if ($tag -notmatch '^\d{4}\.\d{2}\.\d{2}(\.\d+)?$') { throw "Unexpected yt-dlp tag: $tag" }
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          $sums = Join-Path $env:RUNNER_TEMP "yt-dlp-SHA2-256SUMS"
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile $sums
          $line = Select-String -Path $sums -Pattern '^([0-9a-fA-F]{64})\s+\*?yt-dlp\.exe\s*$' | Select-Object -First 1
          if (-not $line) { throw "No checksum line for yt-dlp.exe in SHA2-256SUMS" }
          $expected = $line.Matches[0].Groups[1].Value.ToLower()
          $actual = (Get-FileHash "tools/yt-dlp.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "yt-dlp.exe SHA-256 mismatch: expected $expected, got $actual" }
          Write-Host "OK: yt-dlp $tag verified ($actual)"

      # yt-dlp (from 2026) requires Node >= 22 for YouTube JS challenges.
      - name: Download node.exe (portable Node 22, verified against SHASUMS256.txt)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $base = "https://nodejs.org/dist/latest-v22.x"
          $sums = Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          Invoke-WebRequest -Uri "$base/win-x64/node.exe" -OutFile "tools/node.exe"
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile $sums
          $line = Select-String -Path $sums -Pattern '^([0-9a-fA-F]{64})\s+win-x64/node\.exe\s*$' | Select-Object -First 1
          if (-not $line) { throw "No checksum line for win-x64/node.exe in SHASUMS256.txt" }
          $expected = $line.Matches[0].Groups[1].Value.ToLower()
          $actual = (Get-FileHash "tools/node.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "node.exe SHA-256 mismatch: expected $expected, got $actual" }
          Write-Host "OK: node.exe verified ($actual)"

      # ffmpeg.exe được tải + xác minh SHA-256 bởi scripts/fetch-ffmpeg.js (chạy ở bước `npm ci`
      # qua postinstall và lại ở `predist --required`).

      # CI is the only publisher. electron-builder only builds (never uploads)
      # so the installer and latest.yml cannot get out of sync from two writers.
      - name: Build installer
        run: npm run dist -- --publish never

      - name: Generate latest.yml from the built installer
        run: node scripts/write-latest-yml.js

      - name: Verify update metadata matches installer
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $yml = Get-Content release/latest.yml -Raw
          if ($yml -notmatch "path:\s*(\S+)") { throw "latest.yml missing path" }
          $name = $Matches[1].Trim()
          $exe = Get-Item "release/$name"
          if ($yml -notmatch "size:\s*(\d+)") { throw "latest.yml missing size" }
          if ([int64]$Matches[1] -ne $exe.Length) { throw "latest.yml size ($($Matches[1])) != exe ($($exe.Length))" }
          if ($yml -notmatch "version:\s*(\S+)") { throw "latest.yml missing version" }
          $ymlVersion = $Matches[1].Trim().Trim("'").Trim('"')
          if ($ymlVersion -ne $pkg.version) {
            throw "latest.yml version ($ymlVersion) != package.json ($($pkg.version))"
          }
          $bytes = [System.IO.File]::ReadAllBytes("release/latest.yml")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "latest.yml has UTF-8 BOM"
          }
          Write-Host "OK: latest.yml v$ymlVersion matches $name ($($exe.Length) bytes)"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaGet-Windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
