name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.1)'
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon 256x256
        shell: python
        run: |
          import struct, zlib, os

          def make_png(size, r, g, b):
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr_data = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              ihdr_crc = zlib.crc32(b'IHDR' + ihdr_data) & 0xffffffff
              ihdr = struct.pack('>I', 13) + b'IHDR' + ihdr_data + struct.pack('>I', ihdr_crc)
              raw = b''
              for y in range(size):
                  raw += b'\x00'
                  for x in range(size):
                      cx, cy = size // 2, size // 2
                      d = ((x - cx)**2 + (y - cy)**2) ** 0.5
                      margin = size * 0.08
                      if x < margin or x >= size - margin or y < margin or y >= size - margin:
                          raw += bytes([15, 40, 100])
                      else:
                          raw += bytes([r, g, b])
              comp = zlib.compress(raw)
              idat_crc = zlib.crc32(b'IDAT' + comp) & 0xffffffff
              idat = struct.pack('>I', len(comp)) + b'IDAT' + comp + struct.pack('>I', idat_crc)
              iend_crc = zlib.crc32(b'IEND') & 0xffffffff
              iend = struct.pack('>I', 0) + b'IEND' + struct.pack('>I', iend_crc)
              return sig + ihdr + idat + iend

          def make_ico(path):
              sizes = [256, 64, 48, 32, 16]
              images = [make_png(s, 37, 99, 235) for s in sizes]
              count = len(images)
              header = struct.pack('<HHH', 0, 1, count)
              offset = 6 + count * 16
              entries = b''
              for i, (s, img) in enumerate(zip(sizes, images)):
                  w = 0 if s == 256 else s
                  h = 0 if s == 256 else s
                  entries += struct.pack('<BBBBHHII', w, h, 0, 0, 1, 32, len(img), offset)
                  offset += len(img)
              os.makedirs('build', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(header + entries + b''.join(images))
              print(f'Icon created: {path}')

          make_ico('build/icon.ico')

      - name: Download yt-dlp.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tools
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"

      - name: Download node.exe (portable)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.1/win-x64/node.exe" -OutFile "tools/node.exe"

      - name: Build app
        run: npm run build

      # CI lÃ  NÆ I DUY NHáº¤T phÃ¡t hÃ nh. electron-builder chá»‰ build (khÃ´ng tá»± upload)
      # Ä‘á»ƒ trÃ¡nh 2 nguá»“n cÃ¹ng ghi Ä‘Ã¨ lÃªn release -> exe vÃ  latest.yml lá»‡ch nhau.
      - name: Build installer (.exe)
        run: npm run dist -- --publish never

      # KHÃ”NG dá»±a vÃ o electron-builder tá»± sinh latest.yml ná»¯a (Ä‘Ã£ gáº·p trÆ°á»ng há»£p
      # nÃ³ khÃ´ng sinh ra hoáº·c sinh lá»‡ch mÃ  khÃ´ng rÃµ lÃ½ do trÃªn mÃ¡y CI tháº­t).
      # Tá»± tÃ­nh sha512 + size tá»« CHÃNH file .exe vá»«a build ra vÃ  tá»± viáº¿t
      # latest.yml â€” Ä‘áº£m báº£o 2 file nÃ y KHÃ”NG THá»‚ lá»‡ch nhau, vÃ¬ cÃ¹ng láº¥y dá»¯ liá»‡u
      # tá»« má»™t nguá»“n duy nháº¥t táº¡i Ä‘Ã¢y.
      - name: Generate latest.yml from the built installer
        shell: powershell
        run: |
          $exe = Get-Item release/MediaGet-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA512 -Path $exe.FullName).Hash
          $bytes = [byte[]] -split ($hash -replace '..', '0x$& ')
          $sha512 = [Convert]::ToBase64String($bytes)
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @"
          version: $version
          files:
            - url: $($exe.Name)
              sha512: $sha512
              size: $($exe.Length)
          path: $($exe.Name)
          sha512: $sha512
          releaseDate: '$date'
          "@ | Set-Content -Encoding utf8 release/latest.yml
          Write-Host "Da tao release/latest.yml cho $($exe.Name) ($($exe.Length) bytes)"
          Get-Content release/latest.yml

      # Kiá»ƒm tra láº¡i cho cháº¯c: parse láº¡i latest.yml vá»«a táº¡o vÃ  so sÃ¡nh vá»›i file tháº­t
      - name: Verify update metadata matches installer
        shell: powershell
        run: |
          $exe = Get-Item release/MediaGet-Setup.exe
          $yml = Get-Content release/latest.yml -Raw
          if ($yml -notmatch "size:\s*(\d+)") { throw "latest.yml khong co size" }
          if ([int64]$Matches[1] -ne $exe.Length) { throw "latest.yml size ($($Matches[1])) khac exe ($($exe.Length))" }
          Write-Host "OK: latest.yml khop installer ($($exe.Length) bytes)"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaGet-Windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30

      # if: PHáº¢I cÃ³ success() á»Ÿ Ä‘áº§u â€” náº¿u khÃ´ng, bÆ°á»›c nÃ y váº«n cháº¡y dÃ¹ bÆ°á»›c
      # trÆ°á»›c lá»—i (Ä‘Ã¢y chÃ­nh lÃ  lá»—i khiáº¿n release v2.5.9 chá»‰ cÃ³ .exe, thiáº¿u
      # latest.yml: bÆ°á»›c kiá»ƒm tra lá»—i nhÆ°ng bÆ°á»›c táº¡o release váº«n cá»© cháº¡y).
      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Chá»‰ upload .exe + latest.yml tá»± táº¡o á»Ÿ trÃªn (Ä‘Ã£ Ä‘áº£m báº£o khá»›p nhau).
          # Bá» .blockmap: cÃ³ nÃ³ thÃ¬ electron-updater táº£i pháº§n chÃªnh lá»‡ch, dá»… vá»¡
          # náº¿u báº£n trÆ°á»›c bá»‹ lá»—i; khÃ´ng cÃ³ thÃ¬ táº£i nguyÃªn file .exe, cháº­m hÆ¡n
          # má»™t chÃºt nhÆ°ng cháº¯c cháº¯n khÃ´ng tÃ¡i diá»…n lá»—i checksum mismatch.
          files: |
            release/*.exe
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}